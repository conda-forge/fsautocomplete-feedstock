context:
  version: "0.86.1"

package:
  name: fsautocomplete
  version: ${{ version }}

source:
  - git: https://github.com/fsharp/fsautocomplete
    tag: v${{ version }}
    target_directory: git
  - url: https://github.com/ionide/FsAutoComplete/archive/refs/tags/v${{ version }}.tar.gz
    sha256: bbb3d99c9a61f00eb7548529fdb2229e64558267a82d459b6338ec96c1ffcc77

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - fsautocomplete --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE.md
    - git/license-files/
  summary: F# language server using Language Server Protocol
  homepage: https://github.com/fsharp/fsautocomplete

extra:
  recipe-maintainers:
    - danielnachun
