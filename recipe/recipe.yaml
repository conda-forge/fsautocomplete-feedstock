context:
  version: "0.85.4"

package:
  name: fsautocomplete
  version: ${{ version }}

source:
  - git: https://github.com/fsharp/fsautocomplete
    tag: v${{ version }}
    target_directory: git
  - url: https://github.com/ionide/FsAutoComplete/archive/refs/tags/v${{ version }}.tar.gz
    sha256: 7ad879f6fd6001233c2bf2420f60a26e7a7f792e3006721993740597a58bae0e

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - fsautocomplete --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE.md
    - git/license-files/
  summary: F# language server using Language Server Protocol
  homepage: https://github.com/fsharp/fsautocomplete

extra:
  recipe-maintainers:
    - danielnachun
