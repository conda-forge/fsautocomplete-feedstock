context:
  version: "0.87.0"

package:
  name: fsautocomplete
  version: ${{ version }}

source:
  - git: https://github.com/fsharp/fsautocomplete
    tag: v${{ version }}
    target_directory: git
  - url: https://github.com/ionide/FsAutoComplete/archive/refs/tags/v${{ version }}.tar.gz
    sha256: d2a80ffe1e4fd564550d391f99fb7dc6d3f1f74a4807e092f395de8cb0f24fe8

build:
  number: 0
  noarch: generic

requirements:
  build:
    - sed
  host:
    - dotnet
    - nuget-license
  run:
    - dotnet

tests:
  - script:
      - fsautocomplete --help

about:
  license: Apache-2.0
  license_file:
    - LICENSE.md
    - git/license-files/
  summary: F# language server using Language Server Protocol
  homepage: https://github.com/fsharp/fsautocomplete

extra:
  recipe-maintainers:
    - danielnachun
